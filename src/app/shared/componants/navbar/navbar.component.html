<nav class="sticky top-0 z-[100] w-full bg-white/80 backdrop-blur-lg transition-all duration-300">
  <div class="max-w-[1440px] mx-auto px-4 sm:px-6 lg:px-10 py-3 flex items-center justify-between">

    <div class="flex items-center gap-4">
      <button
        class="md:hidden flex items-center justify-center w-10 h-10 rounded-xl text-gray-700 hover:bg-gray-100 transition shadow-sm border border-gray-100"
        (click)="isMenuOpen = !isMenuOpen">
        <i class="fa-solid" [ngClass]="isMenuOpen ? 'fa-xmark' : 'fa-align-left'"></i>
      </button>

      <a href="/app-home" class="flex-shrink-0 transition-transform hover:scale-105">
        <img src="./../../../../assets/images/Dominus_black.png" alt="Dominus Logo" class="w-12 md:w-14 lg:w-16">
      </a>
    </div>

    <ul class="hidden lg:flex items-center gap-8 text-[13px] tracking-widest font-bold text-gray-600">
      <li><a routerLink="/products" class="hover:text-blue-600 transition-colors relative group">
          Shop
          <span class="absolute -bottom-1 left-0 w-0 h-0.5 bg-blue-600 transition-all group-hover:w-full"></span>
        </a></li>
      <li><a routerLink="./app-contact-us" class="hover:text-blue-600 transition-colors relative group">
          Contact
          <span class="absolute -bottom-1 left-0 w-0 h-0.5 bg-blue-600 transition-all group-hover:w-full"></span>
        </a></li>
      <li><a routerLink="/app-about" class="hover:text-blue-600 transition-colors relative group">
          About
          <span class="absolute -bottom-1 left-0 w-0 h-0.5 bg-blue-600 transition-all group-hover:w-full"></span>
        </a></li>
    </ul>

    <div class="hidden md:flex relative flex-1 max-w-md mx-8 group">
      <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
        <svg class="w-4 h-4 text-gray-400 group-focus-within:text-blue-500 transition-colors" fill="none"
          viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"
            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
        </svg>
      </div>
      <input [value]="searchTerm" (input)="onSearchChange($event)"
        class="w-full bg-gray-50 border border-transparent py-2.5 pl-11 pr-10 rounded-2xl text-sm text-gray-800 placeholder-gray-400 focus:bg-white focus:border-blue-500/30 focus:ring-4 focus:ring-blue-500/5 transition-all outline-none shadow-inner"
        placeholder="Search for premium tech..." />

      <button *ngIf="searchTerm" (click)="clearSearch()"
        class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-rose-500 p-1">
        <i class="fa-solid fa-circle-xmark"></i>
      </button>
    </div>

    <div class="flex items-center gap-3 sm:gap-5">

      <div *ngIf="!isAdmin" class="flex items-center gap-1 sm:gap-2">
        <button routerLink="/app-cart"
          class="relative p-2.5 rounded-xl text-gray-600 hover:bg-green-50 hover:text-green-600 transition-all active:scale-95 group">
          <i class="fa-brands fa-opencart text-xl"></i>
          <span *ngIf="cartItemCount > 0"
            class="absolute top-1.5 right-1.5 bg-green-600 text-white text-[10px] font-bold rounded-full h-4 w-4 flex items-center justify-center ring-2 ring-white">
            {{ cartItemCount }}
          </span>
        </button> <button routerLink="/app-wishlist"
          class="relative p-2.5 rounded-xl text-gray-600 hover:bg-rose-50 hover:text-rose-500 transition-all active:scale-95 group">
          <i class="fa-regular fa-heart text-xl"></i>
          <span *ngIf="wishListItemCount > 0"
            class="absolute top-1.5 right-1.5 bg-rose-500 text-white text-[10px] font-bold rounded-full h-4 w-4 flex items-center justify-center ring-2 ring-white">
            {{ wishListItemCount }}
          </span>
        </button>


      </div>

      <div class="h-8 w-[1px] bg-gray-200 mx-1 hidden sm:block"></div>

      <div *ngIf="userProfile?.id" class="relative">
        <button (click)="toggleProfileDropdown()"
          class="flex items-center gap-2 p-1 rounded-full border border-gray-200 hover:border-blue-400 hover:shadow-md transition-all">
          <img class="w-8 h-8 rounded-full object-cover"
            src="https://plus.unsplash.com/premium_vector-1745915292293-f52e77ccb147?auto=format&fit=crop&q=80&w=880"
            alt="User">
          <i class="fa-solid fa-chevron-down text-[10px] text-gray-400 mr-2"
            [ngClass]="{'rotate-180': showProfileDropdown}"></i>
        </button>

        <div *ngIf="showProfileDropdown"
          class="absolute right-0 mt-3 w-56 rounded-2xl shadow-[0_20px_50px_rgba(0,0,0,0.15)] py-3 z-50 bg-white border border-gray-100 animate-slideIn">
          <div class="px-4 py-2 border-bottom mb-2">
            <p class="text-xs text-gray-400 font-bold tracking-tighter">Account</p>
            <p class="text-sm font-bold text-gray-800 truncate">{{userProfile?.email}}</p>
          </div>

          <a class="flex items-center gap-3 px-4 py-2.5 hover:bg-gray-50 text-gray-700 transition-colors cursor-pointer"
            (click)="profileClicked()">
            <i class="fa-solid fa-circle-user text-blue-500"></i>
            <span class="text-sm font-medium">My Profile</span>
          </a>

          <a *ngIf="userProfile?.role?.toLowerCase() === 'user'" routerLink="/app-orders"
            class="flex items-center gap-3 px-4 py-2.5 hover:bg-gray-50 text-gray-700 transition-colors"
            (click)="naviagteToOrder()">
            <i class="fa-solid fa-box-open text-orange-500"></i>
            <span class="text-sm font-medium">My Orders</span>
          </a>

          <div *ngIf="userProfile?.role?.toLowerCase() === 'admin'" class="border-t border-gray-50 pt-2 mt-2">
            <a (click)="navigation()"
              class="flex items-center gap-3 px-4 py-2.5 hover:bg-blue-50 text-blue-600 transition-colors cursor-pointer">
              <i class="fa-solid fa-shield-halved"></i>
              <span class="text-sm font-bold">Admin Panel</span>
            </a>
          </div>

          <div class="border-t border-gray-50 mt-2 pt-2">
            <button (click)="handleLogout()"
              class="flex items-center gap-3 px-4 py-2.5 hover:bg-rose-50 text-rose-600 transition-colors w-full text-left font-medium">
              <i class="fa-solid fa-arrow-right-from-bracket"></i>
              <span class="text-sm">Sign Out</span>
            </button>
          </div>
        </div>
      </div>

      <button *ngIf="!userProfile?.id"
        class="bg-gray-900 text-white rounded-xl px-6 py-2 text-sm font-bold hover:bg-blue-600 shadow-lg shadow-gray-200 transition-all active:scale-95"
        routerLink="/app-login">
        Sign In
      </button>

    </div>
  </div>

  <div *ngIf="isMenuOpen"
    class="absolute top-full left-0 w-full bg-white border-t border-gray-100 shadow-2xl md:hidden flex flex-col p-6 space-y-4 z-[90] animate-slideIn">

    <div class="relative w-full">
      <input [value]="searchTerm" (input)="onSearchChange($event)"
        class="w-full bg-gray-50 rounded-xl py-3 pl-10 pr-4 border-none text-sm" placeholder="Search products..." />
      <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
    </div>

    <div class="flex flex-col gap-1">
      <a routerLink="/products" (click)="closeMenu()"
        class="p-3 font-bold text-gray-700 hover:bg-gray-50 rounded-lg">Shop</a>
      <a routerLink="/app-about" (click)="closeMenu()"
        class="p-3 font-bold text-gray-700 hover:bg-gray-50 rounded-lg">About Us</a>
      <a routerLink="./app-contact-us" (click)="closeMenu()"
        class="p-3 font-bold text-gray-700 hover:bg-gray-50 rounded-lg">Contact</a>
    </div>

    <div class="pt-4 border-t flex flex-col gap-3">
      <button *ngIf="!userProfile?.id"
        class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold shadow-lg shadow-blue-100">Get Started</button>
    </div>
  </div>
</nav>
