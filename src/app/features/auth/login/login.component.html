<div
  class="flex flex-col lg:flex-row h-screen w-full bg-gray-50 overflow-hidden transition-all duration-500 ease-in-out relative">

  <!-- Geometric shapes in the background -->
  <div class="absolute inset-0 overflow-hidden pointer-events-none">
    <!-- Blue shapes -->
    <div class="absolute top-10 left-5 w-16 h-16 bg-blue-500 rounded-full opacity-10 animate-pulse"></div>
    <div class="absolute top-1/4 right-1/4 w-24 h-8 bg-blue-400 rounded-lg opacity-10 transform rotate-12"></div>
    <div class="absolute bottom-1/3 left-1/4 w-12 h-12 bg-blue-300 rounded-full opacity-10"></div>

    <!-- Red shapes -->
    <div class="absolute top-20 right-10 w-20 h-20 bg-red-500 opacity-10 transform rotate-45"></div>
    <div class="absolute bottom-1/4 left-10 w-16 h-16 bg-red-400 rounded-full opacity-10"></div>
    <div class="absolute top-1/3 right-1/3 w-10 h-10 bg-red-300 opacity-10 transform rotate-45"></div>

    <!-- Yellow shapes -->
    <div class="absolute top-40 left-1/3 w-14 h-14 bg-yellow-500 rounded-lg opacity-10 transform rotate-12"></div>
    <div class="absolute bottom-20 right-20 w-18 h-18 bg-yellow-400 rounded-full opacity-10"></div>
    <div class="absolute top-2/3 left-2/3 w-8 h-8 bg-yellow-300 opacity-10 transform rotate-45"></div>

    <!-- Green shapes -->
    <div class="absolute bottom-10 right-10 w-24 h-24 bg-green-500 opacity-10 rounded-lg"></div>
    <div class="absolute top-10 right-1/4 w-12 h-12 bg-green-400 rounded-full opacity-10"></div>
    <div class="absolute bottom-1/3 right-1/4 w-16 h-8 bg-green-300 opacity-10 transform -rotate-12"></div>

    <!-- Triangle shapes -->
    <div
      class="absolute top-1/4 left-10 w-0 h-0 border-l-[20px] border-r-[20px] border-b-[35px] border-l-transparent border-r-transparent border-b-blue-500 opacity-10">
    </div>
    <div
      class="absolute bottom-1/4 right-1/3 w-0 h-0 border-l-[25px] border-r-[25px] border-t-[45px] border-l-transparent border-r-transparent border-t-red-500 opacity-10">
    </div>
    <div
      class="absolute top-2/3 right-10 w-0 h-0 border-l-[15px] border-r-[15px] border-b-[25px] border-l-transparent border-r-transparent border-b-green-500 opacity-10">
    </div>
    <div
      class="absolute top-10 right-2/3 w-0 h-0 border-b-[30px] border-l-[15px] border-r-[15px] border-b-transparent border-l-yellow-500 border-r-transparent opacity-10">
    </div>
  </div>

  <div
    class="w-full lg:w-1/2 h-full flex items-center justify-center bg-white px-6 lg:px-10 py-6 lg:py-0 overflow-y-auto transition-all duration-500 ease-in-out relative z-10">

    <!-- Small decorative shapes in form area -->
    <div class="absolute top-5 left-5 w-8 h-8 bg-blue-500 rounded-full opacity-70"></div>
    <div class="absolute top-10 right-5 w-6 h-6 bg-red-500 opacity-70 transform rotate-45"></div>
    <div class="absolute bottom-10 left-8 w-10 h-10 bg-yellow-500 rounded-full opacity-70"></div>
    <div class="absolute bottom-5 right-8 w-7 h-7 bg-green-500 opacity-70 transform rotate-12"></div>

    <!-- Triangle in form area -->
    <div
      class="absolute top-20 right-10 w-0 h-0 border-l-[12px] border-r-[12px] border-b-[20px] border-l-transparent border-r-transparent border-b-blue-400 opacity-70">
    </div>
    <div
      class="absolute bottom-20 left-10 w-0 h-0 border-l-[15px] border-r-[15px] border-t-[25px] border-l-transparent border-r-transparent border-t-green-400 opacity-70">
    </div>

    <div class="w-full max-w-sm relative z-20">
      <div class="flex items-center justify-center relative">
        <!-- Decorative shape behind logo -->
        <div class="absolute -inset-4 bg-blue-100 rounded-full opacity-50"></div>
        <div class="absolute -inset-2 bg-red-100 rounded-full opacity-50 transform rotate-45"></div>
        <img src="./../../../../assets/images/Dominus_black.png" alt="Modernize Logo"
          class="w-20 h-20 mb-2 relative z-10" />
      </div>

      <h2 class="text-lg font-semibold text-gray-800 text-center mb-1 relative">
        Welcome Back
        <!-- Small decorative dot -->
        <span class="absolute -right-2 top-0 w-2 h-2 bg-yellow-500 rounded-full opacity-30"></span>
      </h2>
      <p class="text-gray-500 text-center mb-5 text-sm">
        Sign in to your account
      </p>

      <!-- Social Login -->
      <div class="flex gap-3 mb-4 justify-center relative">
        <!-- Decorative shapes in social buttons area -->
        <div class="absolute -left-2 top-1/2 w-3 h-3 bg-blue-500 rounded-full opacity-10"></div>
        <div class="absolute -right-2 top-1/2 w-3 h-3 bg-green-500 rounded-full opacity-10"></div>

       
      </div>

      <div class="flex items-center justify-center mb-4 relative">
        <!-- Decorative shapes in separator -->
        <div class="absolute -left-2 w-3 h-3 bg-blue-500 rounded-full opacity-10"></div>
        <div class="absolute -right-2 w-3 h-3 bg-green-500 rounded-full opacity-10"></div>
        <div class="w-1/3 border-t border-gray-200"></div>
        <span class="mx-2 text-gray-400 text-xs">Login Now</span>
        <div class="w-1/3 border-t border-gray-200"></div>
      </div>

      <form class="space-y-4 relative" #loginForm="ngForm" (ngSubmit)="onSubmit(loginForm)">
        <!-- Small decorative shapes in form -->
        <div class="absolute -bottom-2 -right-2 w-4 h-4 bg-yellow-500 opacity-70 transform rotate-45"></div>

        <div>
          <label for="email" class="block text-gray-700 text-xs font-medium mb-1">
            Email Address
          </label>
          <div class="relative">
            <!-- Decorative dot -->
            <div class="absolute -left-1 top-1/2 -translate-y-1/2 w-2 h-2 bg-red-500 rounded-full opacity-20"></div>
            <i class="fa-solid fa-at fa-md absolute left-5 top-1/2 -translate-y-1/2 text-gray-400 text-s"></i>
            <input type="email" id="email" placeholder="Enter your email" required email [(ngModel)]="email"
              name="email" #emailField="ngModel"
              class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg text-sm focus:border-transparent bg-gray-50 text-black"
              [class.border-red-500]="emailField.invalid && emailField.touched">
          </div>
          <p *ngIf="emailField.invalid && emailField.touched" class="text-red-500 text-xs mt-1">
            Please enter a valid email address.
          </p>
        </div>

        <div>
          <label for="password" class="block text-gray-700 text-xs font-medium mb-1">
            Password
          </label>
          <div class="relative">
            <!-- Decorative dot -->
            <div class="absolute -left-1 top-1/2 -translate-y-1/2 w-2 h-2 bg-green-500 rounded-full opacity-20"></div>
            <!-- Lock icon -->
            <i class="fa-solid fa-lock absolute left-5 top-1/2 -translate-y-1/2 text-gray-400 text-sm">
            </i>

            <!-- Password Input -->
            <input [type]="showPassword ? 'text' : 'password'" id="password" placeholder="Enter password" required
              minlength="6" [(ngModel)]="password" name="password" #passwordField="ngModel"
              class="w-full pl-10 pr-10 py-2 border border-gray-300 rounded-lg text-sm bg-gray-50 text-black"
              [class.border-red-500]="passwordField.invalid && passwordField.touched">

            <!-- Eye toggle -->
            <button type="button" (click)="togglePasswordVisibility()"
              class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 focus:outline-none">
              <i class="fa-solid" [ngClass]="showPassword ? 'fa-eye-slash' : 'fa-eye'">
              </i>
            </button>
          </div>

          <p *ngIf="passwordField.invalid && passwordField.touched" class="text-red-500 text-xs mt-1">
            Password must be at least 6 characters long.
          </p>
        </div>

        <!-- Remember + Forgot -->
        <div class="flex items-center justify-between text-xs p-2 relative">
          <!-- Decorative shape -->
          <div class="absolute -right-2 -top-2 w-6 h-6 bg-yellow-500 opacity-70 rounded-full"></div>

          <!-- <label class="flex items-center gap-2 text-gray-600">
            <input type="checkbox"
              class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded" />
            Remember me
          </label> -->
          <a routerLink="/forgot-password" class="text-blue-600 hover:text-blue-800 font-medium">
            Forgot password?
          </a>
        </div>

        <app-button [label]="isSubmitting ? 'Logging...' : 'Sign In'" [type]="'submit'" [color]="'blue'"
          [disabled]="loginForm.invalid || isSubmitting" class="w-full relative">
          <!-- Decorative dots on button -->
          <div class="absolute -top-1 -left-1 w-2 h-2 bg-blue-500 rounded-full opacity-30"></div>
          <div class="absolute -top-1 -right-1 w-2 h-2 bg-red-500 rounded-full opacity-30"></div>
          <div class="absolute -bottom-1 -left-1 w-2 h-2 bg-yellow-500 rounded-full opacity-30"></div>
          <div class="absolute -bottom-1 -right-1 w-2 h-2 bg-green-500 rounded-full opacity-30"></div>
          {{isSubmitting ? 'Signing in...' : 'Sign In'}}
        </app-button>
      </form>
      <div class="mt-6 text-center relative w-full">
        <div
          class="absolute -left-4 top-1/2 -translate-y-1/2 w-0 h-0 border-l-[6px] border-r-[6px] border-b-[10px] border-l-transparent border-r-transparent border-b-blue-500 opacity-40">
        </div>

        <p class="text-xs text-gray-500">
          Don't have an account?
          <a routerLink="/app-register" class="text-blue-600 hover:underline font-bold ml-1">
            Sign Up
          </a>
        </p>
      </div>
    </div>
  </div>

  <div class="hidden lg:flex lg:w-1/2 h-full items-center justify-center relative overflow-hidden bg-white">
    <!-- Decorative shapes in image area -->
    <div class="absolute top-10 left-10 w-20 h-20 bg-blue-500 rounded-full opacity-70"></div>
    <div class="absolute bottom-10 right-10 w-24 h-24 bg-red-500 opacity-70 transform rotate-45"></div>
    <div class="absolute top-1/3 right-1/4 w-16 h-16 bg-yellow-500 rounded-full opacity-70"></div>
    <div class="absolute bottom-1/3 left-1/4 w-12 h-12 bg-green-500 opacity-70 transform rotate-12"></div>

    <!-- Triangles in image area -->
    <div
      class="absolute top-20 right-20 w-0 h-0 border-l-[25px] border-r-[25px] border-b-[40px] border-l-transparent border-r-transparent border-b-blue-500 opacity-70">
    </div>
    <div
      class="absolute bottom-20 left-20 w-0 h-0 border-l-[20px] border-r-[20px] border-t-[35px] border-l-transparent border-r-transparent border-t-red-500 opacity-70">
    </div>

    <img src="./../../../../assets/illust/login.svg" alt="Login Illustration"
      class="max-w-[80%] max-h-[80%] object-contain transition-all duration-500 ease-in-out transform relative z-10" />
  </div>
</div>
